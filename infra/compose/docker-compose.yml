# Socle de données + API métier.
#
# Déploiement : docker compose --env-file .env -f infra/compose/docker-compose.yml up -d --wait
#
# Exposition réseau minimale (règle du projet) : PostgreSQL reste sur le réseau
# interne `db-internal` et ne publie aucun port sur l'hôte ; l'API n'est pas
# publiée non plus, elle est joignable sous le nom d'hôte `api` sur le port 8000
# depuis `resilience-net`. Seule la passerelle (`gateway`, front + routage) est publiée,
# et seulement sur 127.0.0.1:8080 : le WAF s'y substituera ou s'y ajoutera.
#
# `resilience-net` est déclaré ici avec un nom fixe (`name: resilience-net`), sans
# préfixe de projet : les autres piles Compose (observabilité, WAF) le référencent
# en `external: true`. Chaque pile reste autonome, on ne fusionne pas les fichiers.
#
# Les mots de passe ne sont jamais écrits ici : ils viennent de `.env`, qu'il faut
# passer explicitement (`--env-file .env`), car Compose ne cherche un `.env` qu'à
# côté de ce fichier. Sans lui, les variables restent vides et PostgreSQL refuse
# de démarrer : l'échec est immédiat, jamais silencieux.

name: resilience-alpha

networks:
  resilience-net:
    name: resilience-net
    driver: bridge
  db-internal:
    name: resilience-db-internal
    internal: true # aucune sortie vers l'hôte ni Internet
  logs-query:
    name: resilience-logs-query
    internal: true # détecteur <-> Loki (lecture des journaux du WAF), et rien d'autre
  control-internal:
    name: resilience-control-internal
    internal: true # moteur de remédiation <-> sa passerelle Docker, et rien d'autre
  rag:
    name: resilience-rag
    driver: bridge # pas `internal` : Ollama tourne sur le PC hôte ou un 3e PC, hors de Docker

volumes:
  postgres-data:
  postgres-backups:
  waf-blocklist: # liste de sources bloquées : écrite par le moteur, lue par le WAF

x-api-image: &api-image
  image: resilience-alpha/api:dev
  build:
    context: ../..
    dockerfile: services/api/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    container_name: resilience-postgres
    restart: unless-stopped
    mem_limit: 256m # PC Hôte à 16 Go : chaque conteneur est borné
    networks:
      - db-internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resilience}
      POSTGRES_USER: ${POSTGRES_USER:-resilience_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resilience_owner} -d ${POSTGRES_DB:-resilience}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # Authentification : inscription, connexion, émission du jeton JWT. Mêmes droits base que
  # l'API (`app_rw`). Le secret JWT est partagé avec l'API, qui vérifie les jetons.
  auth:
    image: resilience-alpha/auth:dev
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    container_name: resilience-auth
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - db-internal # accès à PostgreSQL
      - resilience-net # joignable par la passerelle
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-resilience}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit etre defini (voir .env.example)}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-7200}
      WELCOME_BALANCE_CENTS: ${WELCOME_BALANCE_CENTS:-100000}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health').is_success else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Passerelle : front React + routage /auth -> auth, /me -> api. Plus publiée : le WAF
  # (ci-dessous) est le seul point d'entrée.
  gateway:
    image: resilience-alpha/gateway:dev
    build:
      context: ../..
      dockerfile: infra/compose/gateway/Dockerfile
    container_name: resilience-gateway
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - resilience-net
    expose:
      - "8080" # joignable par le WAF seulement : plus aucun port publié ici
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /data # état Caddy
      - /config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # le binaire Caddy porte cette capability : sans elle, exec échoue
    security_opt:
      - no-new-privileges:true

  # WAF : ModSecurity + OWASP Core Rule Set en reverse proxy devant la passerelle. Seul
  # service publié, et seulement en local (127.0.0.1) : le PC Attaquant passe par le réseau
  # de l'hôte, jamais par un port ouvert sur toutes les interfaces. Le moteur de règles
  # bloque (MODSEC_RULE_ENGINE=on) ; les événements bloqués sortent en JSON sur stdout,
  # collectés par Alloy -> Loki (SIEM). Image épinglée par digest (risque tiers, DORA).
  waf:
    image: owasp/modsecurity-crs:nginx-alpine@sha256:873ce68a658d2e3b61484a8a24d215f7d15456e7ce5aec5e7114bf000d743365
    container_name: resilience-waf
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - resilience-net
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      PORT: "8080"
      BACKEND: http://gateway:8080
      MODSEC_RULE_ENGINE: "on"
      # Journal d'audit sans en-têtes de requête (B), corps de requête (I) ni corps de réponse
      # (E) : ils contiendraient jetons JWT, mots de passe et données clients, qui n'ont rien à
      # faire dans Loki. Restent l'en-tête (A), les en-têtes de réponse (F), les règles
      # déclenchées (H) et la fin d'enregistrement (Z).
      MODSEC_AUDIT_LOG_PARTS: AFHKZ
      # Niveau 1 : le moins de faux positifs sur le trafic légitime ; à relever après essais.
      BLOCKING_PARANOIA: ${WAF_PARANOIA:-1}
      ANOMALY_INBOUND: ${WAF_ANOMALY_INBOUND:-5}
      # L'IP du client est celle vue par le WAF : aucun en-tête X-Real-IP forgé n'est cru.
      SET_REAL_IP_FROM: ""
    volumes:
      - waf-blocklist:/blocklist:ro
      # Modèles nginx de l'image, complétés pour charger njs et refuser les sources bloquées.
      - ../waf/templates/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ../waf/templates/includes/proxy_backend.conf.template:/etc/nginx/templates/includes/proxy_backend.conf.template:ro
      - ../waf/templates/conf.d/logging.conf.template:/etc/nginx/templates/conf.d/logging.conf.template:ro
      - ../waf/njs:/etc/nginx/njs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Service éphémère : seul détenteur des droits DDL (rôle propriétaire).
  # L'API, elle, tourne avec `app_rw` qui ne peut pas modifier le schéma.
  migrate:
    <<: *api-image
    container_name: resilience-migrate
    restart: "no"
    mem_limit: 256m
    networks:
      - db-internal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_ADMIN: postgresql+asyncpg://${POSTGRES_USER:-resilience_owner}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-resilience}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:-}
      APP_RO_PASSWORD: ${APP_RO_PASSWORD:-}
      PROBE_BALANCE_CENTS: ${PROBE_BALANCE_CENTS:-1000000}
      SEED_PASSWORD: ${SEED_PASSWORD:-demo-only-not-a-secret}
    command:
      - sh
      - -c
      - alembic -c /app/db/alembic.ini upgrade head && python /app/scripts/seed_demo.py
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    <<: *api-image
    container_name: resilience-api
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - db-internal # accès à PostgreSQL
      - resilience-net # joignable par le front, le moteur de remédiation, Prometheus
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Rôle `app_rw` : SELECT / INSERT / UPDATE, aucun DDL, aucun DELETE.
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-resilience}
      PROBE_TOKEN: ${PROBE_TOKEN:?PROBE_TOKEN doit etre defini (voir .env.example)}
      PROBE_ACCOUNT_IBAN: ${PROBE_ACCOUNT_IBAN:-TEST-0001}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit etre defini (voir .env.example)}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      SQL_ECHO: ${SQL_ECHO:-0}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health').is_success else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Passerelle Docker du moteur de remédiation : seul conteneur de la pile à monter le
  # socket. Elle ne laisse passer que le redémarrage/arrêt d'un conteneur existant
  # (ALLOW_RESTARTS) : ni création de conteneur, ni exec, ni image, ni volume. Distincte
  # de la passerelle en lecture seule de l'observabilité (docker-compose.observability.yml).
  docker-proxy-ctl:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: resilience-docker-proxy-ctl
    restart: unless-stopped
    mem_limit: 32m
    environment:
      ALLOW_RESTARTS: "1"
      # POST doit valoir 1 : le gabarit HAProxy refuse toute méthode hors GET avant d'évaluer
      # ALLOW_RESTARTS. Les autres sections restant à 0, seuls restart/stop/kill passent
      # (vérifié : create, exec, GET /containers/json et DELETE renvoient 403).
      POST: "1"
      CONTAINERS: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VERSION: "0"
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - control-internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Sauvegarde planifiée et restauration PostgreSQL. Le rôle propriétaire reste dans ce
  # conteneur privé ; seules ses routes fixes backup/restore, protégées par PROBE_TOKEN,
  # sont joignables depuis le moteur sur control-internal. Les archives résident sur un
  # volume distinct des données PostgreSQL.
  db-recovery:
    image: resilience-alpha/db-recovery:dev
    build:
      context: ../..
      dockerfile: services/db/recovery/Dockerfile
    container_name: resilience-db-recovery
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - db-internal
      - control-internal
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-resilience}
      POSTGRES_USER: ${POSTGRES_USER:-resilience_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini (voir .env.example)}
      PROBE_TOKEN: ${PROBE_TOKEN:?PROBE_TOKEN doit etre defini (voir .env.example)}
      DB_BACKUP_PATH: /backups
      DB_BACKUP_INTERVAL_S: ${DB_BACKUP_INTERVAL_S:-300}
      DB_BACKUP_RETENTION: ${DB_BACKUP_RETENTION:-12}
    volumes:
      - postgres-backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Moteur de remédiation : reçoit les anomalies (POST /incidents), redémarre le service
  # touché via la passerelle, puis exige API saine ET transaction de test réussie.
  remediation:
    image: resilience-alpha/remediation:dev
    build:
      context: ../..
      dockerfile: services/remediation/Dockerfile
    container_name: resilience-remediation
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - control-internal # passerelle Docker
      - resilience-net # sonde vers l'API, appels du détecteur
    expose:
      - "8000"
    depends_on:
      docker-proxy-ctl:
        condition: service_started
      db-recovery:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      REMEDIATION_INGEST_TOKEN: ${REMEDIATION_INGEST_TOKEN:?REMEDIATION_INGEST_TOKEN doit etre defini (voir .env.example)}
      API_BASE_URL: http://api:8000
      DOCKER_PROXY_URL: http://docker-proxy-ctl:2375
      DATABASE_RECOVERY_URL: http://db-recovery:8001
      DB_RESTORE_SAFETY_MARGIN_S: ${DB_RESTORE_SAFETY_MARGIN_S:-15}
      PROBE_TOKEN: ${PROBE_TOKEN:?PROBE_TOKEN doit etre defini (voir .env.example)}
      CONTAINER_NAMES: ${CONTAINER_NAMES:-api=resilience-api}
      WAF_BLOCKLIST_PATH: /blocklist/blocked.txt
      WATCH_INTERVAL_S: ${WATCH_INTERVAL_S:-5}
      WATCH_FAILURES: ${WATCH_FAILURES:-3}
    volumes:
      - waf-blocklist:/blocklist # écriture de la liste de blocage ; le WAF la lit en lecture seule
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health').is_success else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Détecteur ML : lit les métriques dans Prometheus (pile d'observabilité, même réseau),
  # juge chaque mesure avec le modèle IsolationForest et signale au moteur (POST /incidents).
  # Le modèle (ml/models/) est monté en lecture seule : c'est du code désérialisé.
  anomaly-detector:
    image: resilience-alpha/anomaly-detector:dev
    build:
      context: ../..
      dockerfile: services/anomaly-detector/Dockerfile
    container_name: resilience-anomaly-detector
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - resilience-net # Prometheus (autre pile) et moteur de remédiation
      - logs-query # Loki : identifier le compte qui émet le flood
    expose:
      - "8000"
    depends_on:
      remediation:
        condition: service_healthy
    environment:
      REMEDIATION_INGEST_TOKEN: ${REMEDIATION_INGEST_TOKEN:?REMEDIATION_INGEST_TOKEN doit etre defini (voir .env.example)}
      PROMETHEUS_URL: http://prometheus:9090
      REMEDIATION_URL: http://remediation:8000
      LOKI_URL: http://loki:3100
      ATTACKER_WINDOW: ${ATTACKER_WINDOW:-30s}
      ATTACKER_MIN_REQUESTS: ${ATTACKER_MIN_REQUESTS:-100}
      ATTACKER_MIN_SHARE: ${ATTACKER_MIN_SHARE:-0.5}
      MODEL_PATH: /models/isolation_forest.joblib
      TARGET_SERVICE: ${DETECTOR_TARGET_SERVICE:-api}
      POLL_INTERVAL_S: ${DETECTOR_POLL_INTERVAL_S:-5}
      CONFIRMATIONS: ${DETECTOR_CONFIRMATIONS:-3}
      COOLDOWN_S: ${DETECTOR_COOLDOWN_S:-90}
    volumes:
      - ../../ml/models:/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health').is_success else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  # Assistant RAG (Ollama + LangChain). Isolé : seul membre du réseau `rag`, donc aucun chemin
  # vers l'API, la base, le moteur de remédiation ni Docker. Corpus monté en lecture seule
  # (documentation du dépôt), système de fichiers en lecture seule. Non publié : on l'interroge
  # par `docker compose exec rag-assistant python -m app.cli ask "..."`. Ollama est joint par
  # OLLAMA_URL (PC hôte par défaut ; voir .env.example pour le 3e PC).
  rag-assistant:
    image: resilience-alpha/rag-assistant:dev
    build:
      context: ../..
      dockerfile: services/rag-assistant/Dockerfile
    container_name: resilience-rag-assistant
    restart: unless-stopped
    mem_limit: 384m # les modèles tournent dans Ollama, pas ici
    networks:
      - rag
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Ollama sur l'hôte Linux
    environment:
      RAG_TOKEN: ${RAG_TOKEN:?RAG_TOKEN doit etre defini (voir .env.example)}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${RAG_LLM_MODEL:-llama3.1:8b}
      EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
      CORPUS_PATH: /corpus
    volumes:
      - ../../docs:/corpus/docs:ro
      - ../../README.md:/corpus/README.md:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health').is_success else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

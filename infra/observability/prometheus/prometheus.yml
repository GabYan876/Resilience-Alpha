# Prometheus — PROJECT RESILIENCE-ALPHA
#
# Rôle : collecte des métriques des microservices, pour rendre l'incident visible
# avant / pendant / après.
#
# Les cibles absentes ne sont pas une erreur : Prometheus les expose avec `up == 0`,
# ce qui est exactement le signal « service injoignable » attendu par le dashboard et
# par le détecteur ML. Aucune cible n'est donc commentée, même si le service
# correspondant n'est pas encore déployé.
#
# Contrat d'instrumentation attendu des services (port 8000, chemin /metrics) :
#   - http_requests_total{method,handler,status}            compteur
#   - http_request_duration_seconds_bucket{method,handler}  histogramme
# Le label `service` n'est pas fourni par les services : il est ajouté ici, cible par
# cible, pour que le dashboard fonctionne quelle que soit l'instrumentation applicative.

global:
  scrape_interval: 10s # un flood doit être visible en quelques points de mesure
  scrape_timeout: 5s
  evaluation_interval: 30s
  external_labels:
    env: lab
    site: pc-hote

# Pas d'Alertmanager ni de fichier de règles : la détection est faite par le modèle ML
# et la décision par le moteur de remédiation, pas par des seuils codés en dur.
scrape_configs:
  # --- Services métier et chaîne de remédiation --------------------------------
  - job_name: microservices
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
          tier: app
      - targets: ["auth:8000"]
        labels:
          service: auth
          tier: app
      - targets: ["remediation:8000"]
        labels:
          service: remediation
          tier: control
      - targets: ["anomaly-detector:8000"]
        labels:
          service: anomaly-detector
          tier: control

  # --- Auto-surveillance de la stack d'observabilité ---------------------------
  - job_name: observability
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          service: prometheus
          tier: obs
      - targets: ["loki:3100"]
        labels:
          service: loki
          tier: obs
      - targets: ["alloy:12345"]
        labels:
          service: alloy
          tier: obs
      - targets: ["grafana:3000"]
        labels:
          service: grafana
          tier: obs

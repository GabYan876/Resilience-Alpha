; Firmware de la LED bicolore pour ESP32-DevKitC / ESP32-DevKit V1.
; Version épinglée : le core Arduino 2.0.14 de espressif32@6.6.0 ne collecte pas les en-têtes
; HTTP demandés (X-Counter arrivait vide, signature toujours refusée) et n'a pas
; `collectAllHeaders`. 8.0.0 tire le core 3.3.12, sur lequel les 5 modes sont prouvés.
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Firmware de la LED bicolore (consigne additionnelle 1). Ouvrir le dossier dans CLion (plugin PlatformIO).
; Deux cartes possibles : D1 mini (ESP8266) et DevKit ESP32. Le code est commun, seules les
; bibliothèques réseau et les broches changent (gardes `ARDUINO_ARCH_ESP32` dans src/main.cpp).
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
